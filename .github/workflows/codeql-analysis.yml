# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# You may wish to alter this file to override the set of languages analyzed,
# or to provide custom queries or build logic.
#
# ******** NOTE ********
# We have attempted to detect the languages in your repository. Please check
# the `language` matrix defined below to confirm you have the correct set of
# supported CodeQL languages.
#
name: "CodeQL"

permissions: {}

# ref: https://docs.microsoft.com/en-us/dotnet/devops/dotnet-secure-github-action
on:
  # push:
  #   branches: [ main ]
  #   paths:
  #   - 'src/**/*.cs'
  #   - 'src/**/*.csproj'
  # pull_request:
  #   # The branches below must be a subset of the branches above
  #   branches: [ main ]
  #   paths:
  #   - 'src/**/*.cs'
  #   - 'src/**/*.csproj'
  schedule:
    - cron: '23 20 03,16 * *'
  workflow_dispatch:

env:
  # cSpell:disable
  MINIMAL_DOTNET_SDK_VERSION: 10.0.100
  # cSpell:enable

# cSpell:ignore autobuild
jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # CodeQL supports [ 'cpp', 'csharp', 'go', 'java', 'javascript', 'python', 'ruby' ]
        # Learn more about CodeQL language support at https://git.io/codeql-language-support
        include:
          - language: csharp
            build-mode: manual
            source-root: './src'
          - language: actions
            build-mode: none
            source-root: './.github'

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Initialize CodeQL
      uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        # If you wish to specify custom queries, you can do so here or in a config file.
        # By default, queries listed here will override any specified in a config file.
        # Prefix the list here with "+" to use these queries and those in the config file.
        # queries: ./path/to/local/query, your-org/your-repo/queries@main
        config-file: ./.github/codeql/configurations.yml

    - name: Autobuild
      if: ${{ (matrix.build-mode == 'autobuild') || (matrix.build-mode == '') }}
      uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0

    - name: Prepare .NET SDK ${{ env.MINIMAL_DOTNET_SDK_VERSION }}
      uses: smdn/workflows-dotnet/actions/prepare-dotnet-sdk@ca77c33b60b27d8734f7e7cc02f97a9b274c6779 # actions/prepare-dotnet-sdk/v1.3.0
      if: ${{ (matrix.build-mode == 'manual') && (matrix.language == 'csharp') }}
      with:
        minimal_dotnet_sdk_version: '${{ env.MINIMAL_DOTNET_SDK_VERSION }}'

    - name: Build all .NET projects
      if: ${{ (matrix.build-mode == 'manual') && (matrix.language == 'csharp') }}
      run: |
        ./eng/BuildAllProjects.ps1

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
      with:
        category: "/language:${{ matrix.language }}"
