name: Run tests with release target

permissions: {}

on:
  pull_request:
    types: [opened, reopened, synchronize]

jobs:
  determine-release-target:
    name: Determine the release target
    runs-on: ubuntu-slim
    # The prefix for the release working branch and label for the release target are
    # determined by the `release_tag_prefix` and `release_target_pr_label` parameter
    # in `generate-release-target.yml`. Therefore, the branch name and label filter
    # must match these values.
    if: >-
      startsWith(github.head_ref, 'releases/') &&
      contains(github.event.pull_request.labels.*.name, 'release-target')
    outputs:
      package_id: ${{ steps.release-target.outputs.package_id }}
    steps:
      - name: Determine the release target
        id: release-target
        env:
          INPUT_RELEASE_WORKING_BRANCH: ${{ github.head_ref }}
        shell: bash
        run: |
          release_working_branch=$INPUT_RELEASE_WORKING_BRANCH
          package_id_with_version="${release_working_branch##*/}"
          package_id="${package_id_with_version%%-*}"

          if [ -n "$package_id" ]; then
            echo "package_id=$package_id" >> $GITHUB_OUTPUT
          else
            echo "::error::Could not determine package ID from branch name: $release_working_branch"
            exit 1
          fi

  run-tests-dotnet:
    name: Run .NET tests ${{ needs.determine-release-target.outputs.package_id }}
    uses: smdn/workflows-dotnet/.github/workflows/test.yml@41a6fdd7adfa481246a48c8b7d78cdd7903f07a5 # test/v1.11.3
    permissions:
      contents: read
    needs: determine-release-target
    with:
      project:                                ${{ needs.determine-release-target.outputs.package_id }}
      os:                                     "ubuntu-26.04, ubuntu-24.04, ubuntu-22.04, windows-latest, macos-latest"
      timeout_minutes_test_job:               10
      timeout_hang:                           "[ {'OS':'windows','Timeout':'6min'}, {'OS':'macos','Timeout':'3min'}, {'OS':'','Timeout':'1min'} ]"
      # Perform testing with the release configuration
      dotnet_test_options_configuration: "Release"
      # For testing, use the released package (PackageReference) rather than
      # the local project (ProjectReference) for dependency libraries
      extra_options_common: "/p:ReplaceProjectReferenceToPackageReference=true"
    secrets:
      token_repo: ${{ secrets.GITHUB_TOKEN }}

  post-tests-dotnet:
    # This job is intended to be referenced by the branch protection rules (Status Checks).
    # Do not change the 'name' or job ID, as doing so will break the status check validation.
    # Only run when preceding job succeeds or is skipped (such as when branch/label conditions
    # do not match); avoid 'if: always()' so failures or cancellations in preceding job is
    # not masked as success.
    name: .NET test status
    needs: run-tests-dotnet
    if: ${{ always() && (needs.run-tests-dotnet.result == 'success' || needs.run-tests-dotnet.result == 'skipped') }}
    runs-on: ubuntu-slim
    steps:
      - name: .NET test status
        run: echo "All .NET tests completed successfully."
