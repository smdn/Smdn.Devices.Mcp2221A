name: Publish release target
run-name: Publish release target ${{ github.head_ref }}

permissions: {}

on:
  pull_request:
    types: [closed]

  workflow_dispatch:
    inputs:
      pr_number_request_for_release:
        description: "The number of pull request that requests to merge the release working branch."
        required: true
        type: number

jobs:
  run-publish-release-target:
    name: Publish release target ${{ github.head_ref }}
    uses: smdn/workflows-dotnet/.github/workflows/publish-release-target.yml@21607577114f3fd6ed136af54a6ed21dec281422 # release-target/v1.17.3
    permissions:
      contents: write
      packages: write
      pull-requests: read
    if: |
      (
        (github.event.pull_request.merged == true && startsWith(github.head_ref, 'releases/')) &&
        (contains(github.event.pull_request.labels.*.name, 'release-target'))
      ) ||
      github.event_name == 'workflow_dispatch'
    with:
      pr_number_request_for_release: ${{ fromJson(github.event.pull_request.number || inputs.pr_number_request_for_release) }}
      pr_label_request_for_release:  "release-target"
      workflow_runs_on:              "ubuntu-26.04"
      dotnet_sdk_version:            "10.0.100"
    secrets:
      token_repo:                 ${{ secrets.PUBLISH_NEW_RELEASE }}
      token_push_nuget_org:       ${{ secrets.PUBLISH_PACKAGE_NUGETORG }}
      token_push_github_packages: ${{ secrets.PUBLISH_NEW_RELEASE }}
